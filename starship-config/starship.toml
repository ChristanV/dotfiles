# Switch colour scheme: 'current', 'nord-neovim', 'gruvbox' or 'nord'
palette = 'nord'

format = """
[](fg:accent)\
$os\
$username\
$hostname\
$directory\
[](fg:accent bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface2)\
$nodejs\
$rust\
$golang\
$java\
$python\
$terraform\
$helm\
[](fg:surface2 bg:surface3)\
[ ](fg:surface3)\
$line_break\
[](fg:surface3)\
$aws\
$azure\
[ ](fg:surface3)\
$line_break\
[](fg:surface3)\
$kubernetes\
$container\
[ ](fg:surface3)\
$line_break\
$nix_shell\
$character"""

#$cmd_duration\
[character]
success_symbol = '[❯](accent)'
error_symbol = '[❯](accent)'

[os]
style = "fg:accent_text bg:accent"
format = '[$symbol]($style)'
disabled = false

[username]
show_always = false
style_user = "fg:accent_text bg:accent"
format = "[$user@]($style)"
disabled = true

[hostname]
ssh_only = true
style = "fg:accent_text bg:accent"
format = "[$hostname]($style)"
disabled = true

[directory]
style = "fg:accent_text bg:accent"
format = "[$path]($style)"
truncation_length = 15
truncate_to_repo = false        #truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
style = "bg:surface1"
format = '[[ $symbol$branch](fg:accent_fg bg:surface1)]($style)'

[git_status]
style = "bg:surface1"
format = '[[$ahead_behind($all_status) ](fg:accent_fg bg:surface1)]($style)'
modified = ' 󰷈'
conflicted = ' 󰈸'
staged = ' '
up_to_date = ' ✓'
ahead = ' '
behind = ' '
untracked = ' 󰼅'
stashed = ' '
diverged = ' 󰦻'
deleted = ' '

[cmd_duration]
min_time = 1_000
#style = "bg:surface3"
format = ' $duration'

# Languages
[nodejs]
symbol = ''
style = "bg:surface2"
format = '[[ $symbol ($version) ](fg:accent_fg bg:surface2)]($style)'

[terraform]
symbol = ''
style = "bg:surface2"
format = '[[ $symbol ($version $workspace)](fg:accent_fg bg:surface2)]($style)'
detect_extensions = ['tf', 'tfplan', 'tfstate', "hcl"]

#[ansible]
##symbol = ''
#style = "bg:surface2"
#format = '[[ $symbol ($version) ](fg:accent_fg bg:surface2)]($style)'

[rust]
style = "bg:surface2"
format = '[[ $symbol ($version) ](fg:accent_fg bg:surface2)]($style)'

[golang]
symbol = ''
style = "bg:surface2"
format = '[[ $symbol ($version) ](fg:accent_fg bg:surface2)]($style)'

[java]
symbol = ''
style = "bg:surface2"
format = '[[ $symbol ($version) ](fg:accent_fg bg:surface2)]($style)'

[python]
symbol = ''
style = "bg:surface2"
format = '[[ $symbol ($version $virtualenv)](fg:accent_fg bg:surface2)]($style)'

[helm]
symbol = ''
style = "bg:surface3"
format = '[[ $symbol ($version) ](fg:accent_fg bg:surface2)]($style)'

[nix_shell]
style = "bg:surface3"
#impure_msg = '[impure shell](bold red)'
#pure_msg = '[pure shell](bold green)'
#unknown_msg = '[unknown shell](bold yellow)'
format = 'via [$symbol(\($name\))](bold blue)'

# Other
[time]
disabled = true
time_format = "%R"                                      # Hour:Minute Format
style = "bg:surface3"
format = '[[  $time ](fg:muted bg:surface3)]($style)'

[aws]
disabled = false
symbol = '  '
style = "bg:surface3"
format = '[[ $symbol$aws$profile](fg:muted bg:surface3)]($style)'

[azure]
disabled = false
style = "bg:surface3"
format = '[[ $symbol$azure($subscription)](fg:muted bg:surface3)]($style)'

[kubernetes]
disabled = false
symbol = ''
style = "bg:surface3"
format = '[[ $symbol$kubernetes $context:$namespace](fg:muted bg:surface3)]($style)'

[container]
style = "bg:surface3"
format = '[[ $symbol$name ](fg:muted bg:surface3)]($style)'

# Palettes
[palettes.current]
accent = '#769ff0'      # first segment background, prompt character
accent_text = '#e3e5e5' # text on accent
accent_fg = '#769ff0'   # text on the dark segments
surface1 = '#394260'    # git segment
surface2 = '#212736'    # language segment
surface3 = '#1d2230'    # cloud / k8s segments
muted = '#a0a9cb'       # text on surface3

[palettes.gruvbox]
accent = '#458588'      
accent_text = '#fbf1c7' 
accent_fg = '#83a598'   
surface1 = '#504945'    
surface2 = '#3c3836'    
surface3 = '#282828'    
muted = '#a89984'       

[palettes.nord]
accent = '#88c0d0'      
accent_text = '#2e3440' 
accent_fg = '#81a1c1'   
surface1 = '#4c566a'    
surface2 = '#434c5e'    
surface3 = '#3b4252'    
muted = '#d8dee9'       
